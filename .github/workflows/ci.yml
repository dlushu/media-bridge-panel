name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 语法检查
        run: node tools/check-syntax.js
      - name: 文档与注释文风检查
        run: node tools/check-style.js
      - name: 启动自检
        run: |
          node server.js &
          pid=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8099/api/emby/System/Info/Public > /dev/null; then
              echo "面板已就绪"
              kill $pid
              exit 0
            fi
            sleep 1
          done
          echo "面板未在 20 秒内就绪"
          kill $pid || true
          exit 1
