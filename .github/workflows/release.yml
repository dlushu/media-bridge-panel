# 发布：推送 v<版本> 标签时，产出面板可下载、校验、安装的 Release 资产。
#
# 资产契约见 docs/adr/0019-self-update-from-release.md：
#   media-bridge-panel-<版本>.tar.gz   解包后顶层即 server.js / server/ / public/ / package.json / README.md
#   media-bridge-panel-<版本>.tar.gz.sha256   sha256sum 的标准输出格式（名字 = 包名 + .sha256）
# 面板把压缩包解到 <DATA_DIR>/app/<版本>/，因此包内不套外层目录。
# 只收运行所需文件，不含 docs/、.github/、tools/、node_modules/。

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # tag 与 package.json 版本脱节会让 Release 资产与面板记录的版本对不上，故在打包前中止。
      - name: 校验 tag 与 package.json 版本一致
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          echo "tag 版本：${tag_version}"
          echo "package.json 版本：${pkg_version}"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "版本不一致，发布中止：tag=${tag_version} package.json=${pkg_version}"
            exit 1
          fi
          echo "VERSION=${tag_version}" >> "$GITHUB_ENV"

      # 逐个命名路径而不是打包整个工作目录，包内路径即仓库内路径，不带 ./ 前缀。
      - name: 打包运行时文件
        run: |
          set -euo pipefail
          tar czf "media-bridge-panel-${VERSION}.tar.gz" \
            server.js server public package.json README.md

      # 缺文件要到安装时才暴露，故这里断言必需文件已进包。
      - name: 自检压缩包内容
        run: |
          set -euo pipefail
          archive="media-bridge-panel-${VERSION}.tar.gz"
          listing="$(tar tzf "$archive")"
          echo "$listing"
          for required in server.js server/core/paths.js public/index.html package.json; do
            if ! printf '%s\n' "$listing" | grep -qx "$required"; then
              echo "压缩包缺少必需文件：${required}"
              exit 1
            fi
          done
          # 校验文件名必须与包名一一对应（客户端按 <包地址>.sha256 推导地址）
          case "$archive" in
            media-bridge-panel-*.tar.gz) ;;
            *) echo "包名不符合约定：${archive}"; exit 1 ;;
          esac

      # 资产名必须是 <包名>.sha256：容器引导脚本与面板更新都按"包地址 + .sha256"去找校验文件，
      # 名字差一点就是 404（曾经因为少了 .tar.gz 这一段，首次启动直接失败）。
      - name: 生成校验文件
        run: |
          set -euo pipefail
          archive="media-bridge-panel-${VERSION}.tar.gz"
          sha256sum "$archive" > "${archive}.sha256"
          cat "${archive}.sha256"

      # 发布说明 = CHANGELOG 里这一节的内容。
      # 别只写"见 CHANGELOG.md"：Release 页面是外部第一眼看到的东西，一句"见文件"等于没写
      # （实测被人指出过"怎么不写改了什么"）。摘不到就中止，免得发出一个没有说明的版本。
      - name: 摘出发布说明（CHANGELOG 对应版本那一节）
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside { print }
          ' CHANGELOG.md \
            | sed '/./,$!d' \
            | sed -e "s#](docs/#](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/#g" \
                  -e "s#](CHANGELOG.md)#](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)#g" \
            > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md 里没有 ${VERSION} 这一节（标题应为 ## [${VERSION}]），发布中止"
            exit 1
          fi
          {
            echo "发布说明摘自 [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) 的 ${VERSION} 一节。"
            echo
            cat notes.md
            echo
            echo "---"
            echo "面板「设置 → 版本与更新」里可以手动更新到这个版本；它只安装正式 Release 的资产并校验 sha256。"
          } > notes.full.md
          cat notes.full.md

      # 标签重推或重跑时同名 Release 可能已存在，此时覆盖同名资产而不是失败。
      - name: 创建 Release 并上传资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="media-bridge-panel-${VERSION}.tar.gz"
          checksum="media-bridge-panel-${VERSION}.tar.gz.sha256"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" "$checksum" --clobber
            # 重跑时说明也一起刷新，免得留下上一版的旧说明
            gh release edit "$GITHUB_REF_NAME" --title "$VERSION" --notes-file notes.full.md
          else
            gh release create "$GITHUB_REF_NAME" "$archive" "$checksum" \
              --title "$VERSION" \
              --notes-file notes.full.md
          fi
